name: tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      SLATE_REQUIRE_MINIO: '1'
    strategy:
      matrix:
        php-version: ['8.5']

    services:
      minio:
        image: docker.io/bitnamilegacy/minio@sha256:6dabb4a2088c9a79908de3bc05f4586c23ad2182c8908e7e3acbf61c1467fb20
        env:
          MINIO_ROOT_USER: slate-minio
          MINIO_ROOT_PASSWORD: slate-minio-secret
        ports:
          - 19000:9000

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: xdebug

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      # Restart the Actions service with an explicit writable data path.
      - name: Start MinIO service
        run: |
          docker rm --force "${{ job.services.minio.id }}" || true
          docker run --detach --name slate-ci-minio --publish 19000:9000 \
            --env MINIO_ROOT_USER=slate-minio \
            --env MINIO_ROOT_PASSWORD=slate-minio-secret \
            docker.io/bitnamilegacy/minio@sha256:6dabb4a2088c9a79908de3bc05f4586c23ad2182c8908e7e3acbf61c1467fb20 server /bitnami/minio/data

      - name: Run PHPStan
        run: composer stan

      - name: Run Tests
        run: ./vendor/bin/pest

      - name: Run Security Audit
        run: composer audit

  ffmpeg-render:
    runs-on: ubuntu-24.04-arm
    env:
      SLATE_REQUIRE_FFMPEG: '1'
      SLATE_REQUIRE_MINIO: '1'

    services:
      minio:
        image: docker.io/bitnamilegacy/minio@sha256:6dabb4a2088c9a79908de3bc05f4586c23ad2182c8908e7e3acbf61c1467fb20
        env:
          MINIO_ROOT_USER: slate-minio
          MINIO_ROOT_PASSWORD: slate-minio-secret
        ports:
          - 19000:9000

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      # Restart the Actions service with an explicit writable data path.
      - name: Start MinIO service
        run: |
          docker rm --force "${{ job.services.minio.id }}" || true
          docker run --detach --name slate-ffmpeg-minio --publish 19000:9000 \
            --env MINIO_ROOT_USER=slate-minio \
            --env MINIO_ROOT_PASSWORD=slate-minio-secret \
            docker.io/bitnamilegacy/minio@sha256:6dabb4a2088c9a79908de3bc05f4586c23ad2182c8908e7e3acbf61c1467fb20 server /bitnami/minio/data

      - name: Provision pinned ffmpeg runtime
        run: php artisan slate:provision-ffmpeg

      - name: Run pinned ffmpeg tests
        run: ./vendor/bin/pest --group=ffmpeg-render
